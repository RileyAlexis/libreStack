version: "3.8"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: librestack
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: librestack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librestack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy # Wait for DB to be healthy before attempting startup
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=librestack;Username=librestack;Password=${DB_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"] # Assumes you have a /health endpoint
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
